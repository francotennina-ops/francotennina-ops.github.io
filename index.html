<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Franco Tennina</title>
  <meta name="description" content="Franco Tennina: endocrinología, programa Hashimoto PNIE, música, videos sobre conciencia y The Centerless Operator.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://francotennina.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="Franco Tennina">
  <meta property="og:description" content="Endocrinología · Hashimoto PNIE · Música y conciencia · The Centerless Operator">
  <meta property="og:url" content="https://francotennina.com/">
  <meta property="og:image" content="https://francotennina.com/fran.png">
  <meta name="theme-color" content="#1b0b2a">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Franco Tennina",
    "url": "https://francotennina.com/",
    "image": "https://francotennina.com/fran.png",
    "description": "Médico endocrinólogo, músico y autor de The Centerless Operator.",
    "sameAs": [
      "https://www.instagram.com/frantennina/",
      "https://www.youtube.com/@frantennina"
    ]
  }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #13091e;
      --panel: #1c0d2b;
      --text: #f6f0f8;
      --muted: #cdbfd4;
      --line: rgba(239, 219, 247, .65);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse 65% 62% at 51% -8%, rgba(105, 36, 151, .54), transparent 83%),
        radial-gradient(ellipse 58% 50% at 0% 95%, rgba(91, 29, 136, .23), transparent 75%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid white; outline-offset: 5px; }
    main { width: min(730px, calc(100% - 36px)); margin: 0 auto; padding: 88px 0 48px; }
    .profile { display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 50px; }
    .portrait {
      display: block;
      width: 112px;
      height: 112px;
      flex: 0 0 112px;
      object-fit: cover;
      object-position: center;
      border: 2px solid rgba(248, 236, 253, .85);
      border-radius: 50%;
      background: #372043;
    }
    h1 { margin: 0; font-size: clamp(31px, 5vw, 49px); font-weight: 450; letter-spacing: -.055em; line-height: 1.1; }
    .socials { display: flex; align-items: center; gap: 17px; margin-top: 16px; }
    .socials a { color: #e9dfee; opacity: .85; line-height: 0; transition: opacity .2s ease, transform .2s ease; }
    .socials a:hover { opacity: 1; transform: translateY(-2px); }
    .socials svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .socials .youtube-icon { fill: currentColor; stroke: none; }
    .socials .youtube-play { fill: var(--bg); }
    .links { display: grid; gap: 14px; }
    .link-card {
      min-height: 89px;
      border: 1px solid var(--line);
      border-radius: 23px;
      padding: 18px 28px;
      background: linear-gradient(115deg, rgba(43, 16, 64, .86), rgba(25, 10, 38, .88));
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      transition: background .22s ease, border-color .22s ease, transform .22s ease;
    }
    .link-card:hover { background: #331746; border-color: white; transform: translateY(-2px); }
    .link-title { display: block; font-size: 19px; font-weight: 490; line-height: 1.25; letter-spacing: -.025em; }
    .link-subtitle { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .arrow { align-self: center; color: #dcc7e5; font-size: 20px; font-weight: 300; transition: transform .22s ease; }
    .link-card:hover .arrow { transform: translate(2px, -2px); }
    footer { margin-top: 49px; text-align: center; font-size: 11px; letter-spacing: .06em; color: #af9bb9; }
    @media (max-width: 580px) {
      main { padding-top: 58px; }
      .profile { gap: 17px; margin-bottom: 43px; }
      .portrait { width: 88px; height: 88px; flex-basis: 88px; }
      h1 { font-size: clamp(26px, 7vw, 38px); }
      .socials { margin-top: 12px; }
      .link-card { min-height: 81px; border-radius: 19px; padding: 17px 20px; }
      .link-title { font-size: 17px; }
      .link-subtitle { font-size: 12px; }
    }
    @media (max-width: 380px) {
      .profile { flex-direction: column; text-align: center; }
      .socials { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .socials a, .link-card, .arrow { transition: none; }
      .socials a:hover, .link-card:hover, .link-card:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <img class="portrait" src="https://francotennina.com/fran.png" alt="Franco Tennina" width="112" height="112">
      <div>
        <h1>Franco Tennina</h1>
        <nav class="socials" aria-label="Redes sociales">
          <a href="https://www.instagram.com/frantennina/" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Franco Tennina">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.6" r=".8" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="https://www.youtube.com/@frantennina" target="_blank" rel="noopener noreferrer" aria-label="YouTube de Franco Tennina">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="youtube-icon" x="1.5" y="4.5" width="21" height="15" rx="4"/><path class="youtube-play" d="M10 8.3v7.4l6-3.7z"/></svg>
          </a>
        </nav>
      </div>
    </header>

    <nav class="links" aria-label="Proyectos y servicios">
      <a class="link-card" href="/endocrinologia/">
        <span><span class="link-title">Endocrinología</span><span class="link-subtitle">Consultorios y turnos</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link-card" href="/hashimoto/">
        <span><span class="link-title">Hashimoto · PNIE</span><span class="link-subtitle">Programa clínico de 6 meses para síntomas persistentes</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link-card" href="/operator/">
        <span><span class="link-title">The Centerless Operator</span><span class="link-subtitle">IFF Books · 2027</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link-card" href="https://www.youtube.com/@frantennina" target="_blank" rel="noopener noreferrer">
        <span><span class="link-title">YouTube</span><span class="link-subtitle">Música · Filosofía de la conciencia</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>© 2026 Franco Tennina</footer>
  </main>
</body>
</html>
